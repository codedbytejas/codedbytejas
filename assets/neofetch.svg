<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'ConsolasFallback',Consolas,'SF Mono',Monaco,monospace" width="985px" height="545px" font-size="15px" viewBox="0 0 985 545" role="img" aria-label="Neofetch terminal profile card with ASCII portrait of Tejas Chavan">
<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold'), local('Menlo'), local('Monaco');
  font-family: 'ConsolasFallback';
  font-display: swap;
  -webkit-size-adjust: 109%;
  size-adjust: 109%;
}
.key { fill: #ffa657; }
.value { fill: #a5d6ff; }
.addColor { fill: #3fb950; }
.delColor { fill: #f85149; }
.cc { fill: #616e7f; }
.ascii { fill: #c9d1d9; font-weight: 500; }
text, tspan { white-space: pre; }
</style>

<defs>
  <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3DD6C6" stop-opacity="0.1"/>
    <stop offset="25%" stop-color="#3DD6C6" stop-opacity="0.95"/>
    <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="75%" stop-color="#F5A524" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#F5A524" stop-opacity="0.1"/>
  </linearGradient>
  <filter id="laserGlow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <clipPath id="asciiLoadClip">
    <rect x="0" y="0" width="380" height="545">
      <animate attributeName="height" values="0; 0; 545; 545; 545; 0" keyTimes="0; 0.03; 0.36; 0.88; 0.95; 1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>

